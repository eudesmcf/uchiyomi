[phases.setup]
nixPkgs = ["nodejs_20", "postgresql_16", "tini"]

[phases.install]
cmds = [
  "npm install --global n && \"$(npm prefix --global)/bin/n\" 20.11.1",
  "PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH cd /app/web && PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH npm ci",
  "PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH cd /app/bff && PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH npm ci"
]

[phases.build]
cmds = [
  "PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH cd /app/web && PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH npm run build",
  "PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH cd /app/bff && PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH npm run build"
]

[start]
cmd = "PATH=$(npm prefix --global)/bin:/usr/local/bin:$PATH node bff/dist/server.js"
